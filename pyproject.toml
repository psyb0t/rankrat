[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "rankrat"
version = "0.4.0"
description = "A security-first, boundary-limited SEO and search analytics service over REST and MCP."
readme = "README.md"
requires-python = ">=3.14,<3.15"
license = { file = "LICENSE" }
classifiers = [
  "Development Status :: 3 - Alpha",
  # No license classifier: WTFPL has no trove classifier and the OSI-approved
  # list has no equivalent. `license = { file = "LICENSE" }` above is the
  # declaration; a wrong classifier would be worse than none.
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]
dependencies = [
  "fastapi==0.139.2",
  "httpcore==1.0.9",
  "httpx==0.28.1",
  "mcp==1.28.1",
  "pydantic==2.12.5",
  "pydantic-settings==2.10.1",
  "pyyaml==6.0.3",
  "starlette==1.3.1",
  "uvicorn==0.35.0",
]

[project.scripts]
rankrat = "rankrat.cli:main"

[project.urls]
Homepage = "https://github.com/psyb0t/rankrat"
Repository = "https://github.com/psyb0t/rankrat"
Issues = "https://github.com/psyb0t/rankrat/issues"

[dependency-groups]
dev = [
  "bandit==1.9.4",
  "mypy==1.17.1",
  "pip-audit==2.9.0",
  "pyright==1.1.405",
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "pytest-cov==6.2.1",
  "ruff==0.12.12",
  "types-pyyaml==6.0.12.20250915",
]

[tool.hatch.build.targets.wheel]
packages = ["src/rankrat"]

[tool.uv]
exclude-newer = "2026-07-25T00:00:00Z"
required-version = "==0.8.8"

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers --import-mode=importlib"
asyncio_mode = "auto"
markers = [
  "live: opt-in checks against explicitly configured provider accounts and targets",
]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py314"
extend-exclude = [".research_files"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S104", "S105", "S106"]

[tool.mypy]
python_version = "3.14"
strict = true
warn_unused_configs = true

[tool.pyright]
pythonVersion = "3.14"
typeCheckingMode = "strict"
include = ["src", "tests"]
reportPrivateUsage = false
reportUnusedFunction = false

[tool.coverage.run]
branch = true
source = ["rankrat"]

[tool.coverage.report]
fail_under = 95
show_missing = true
skip_covered = true

[tool.bandit]
exclude_dirs = ["tests"]
skips = []

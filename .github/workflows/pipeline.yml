name: pipeline

# Rankrat publishes images, not a Python package. Pushes to main run the checks
# and publish :latest plus :sha-<commit> for both images. A v* tag waits for that
# commit's main run to succeed, then promotes the same digests to the release tag
# without rebuilding or rerunning checks.
on:
  push:
    branches: [main]
    tags: ["v*"]

permissions: {}

jobs:
  code:
    if: "!startsWith(github.ref, 'refs/tags/')"
    permissions:
      contents: read
      security-events: write # for the sec SARIF upload
    uses: psyb0t/reusable-github-workflows/.github/workflows/code-workflow.yml@master
    with:
      lint_command: "make lint"
      test_command: "make coverage-percent"
      coverage_file: coverage-percent.txt

  # Tag runs read the coverage artifact from the main run they promote.
  badges:
    needs: [code, wait]
    if: "always() && ((github.ref_name == github.event.repository.default_branch && needs.code.result == 'success') || (startsWith(github.ref, 'refs/tags/') && needs.wait.result == 'success'))"
    permissions:
      contents: write
      actions: read # cross-run coverage artifact download on tags
    uses: psyb0t/reusable-github-workflows/.github/workflows/create-badges.yml@master
    with:
      coverage: true
      coverage_run_id: ${{ needs.wait.outputs.run_id }}

  call-docker-image-workflow:
    needs: [code]
    if: "!startsWith(github.ref, 'refs/tags/')"
    permissions:
      contents: write
      security-events: write
    uses: psyb0t/reusable-github-workflows/.github/workflows/docker-image-workflow.yml@master
    with:
      repository_name: psyb0t/rankrat
      push_sha_tag: true
      # VEX statements are justified by security regression tests.
      scan_vex_file: security/rankrat-cpython.openvex.json
      scan_only_fixed: true
      scan_severity: "high"
      scan_fail_build: true
    secrets:
      dockerhub_username: ${{ secrets.DOCKERHUB_USERNAME }}
      dockerhub_token: ${{ secrets.DOCKERHUB_TOKEN }}

  call-lighthouse-image-workflow:
    needs: [code]
    if: "!startsWith(github.ref, 'refs/tags/')"
    permissions:
      contents: write
      security-events: write
    uses: psyb0t/reusable-github-workflows/.github/workflows/docker-image-workflow.yml@master
    with:
      repository_name: psyb0t/rankrat-lighthouse
      target_platforms: linux/amd64
      build_targets: '[{"file":"Dockerfile.lighthouse","tag_suffix":""}]'
      push_sha_tag: true
      scan_only_fixed: true
      scan_severity: "high"
      scan_fail_build: true
    secrets:
      dockerhub_username: ${{ secrets.DOCKERHUB_USERNAME }}
      dockerhub_token: ${{ secrets.DOCKERHUB_TOKEN }}

  wait:
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      actions: read
    uses: psyb0t/reusable-github-workflows/.github/workflows/wait-for-default-branch.yml@master

  docker-promote:
    needs: [wait]
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
      security-events: write
    uses: psyb0t/reusable-github-workflows/.github/workflows/docker-image-workflow.yml@master
    with:
      repository_name: psyb0t/rankrat
      promote_on_tag: true
      create_release: false
      scan_vex_file: security/rankrat-cpython.openvex.json
      scan_only_fixed: true
      scan_severity: "high"
      scan_fail_build: true
    secrets:
      dockerhub_username: ${{ secrets.DOCKERHUB_USERNAME }}
      dockerhub_token: ${{ secrets.DOCKERHUB_TOKEN }}

  lighthouse-promote:
    needs: [wait]
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
      security-events: write
    uses: psyb0t/reusable-github-workflows/.github/workflows/docker-image-workflow.yml@master
    with:
      repository_name: psyb0t/rankrat-lighthouse
      target_platforms: linux/amd64
      build_targets: '[{"file":"Dockerfile.lighthouse","tag_suffix":""}]'
      promote_on_tag: true
      create_release: false
      scan_only_fixed: true
      scan_severity: "high"
      scan_fail_build: true
    secrets:
      dockerhub_username: ${{ secrets.DOCKERHUB_USERNAME }}
      dockerhub_token: ${{ secrets.DOCKERHUB_TOKEN }}

  release:
    needs: [docker-promote, lighthouse-promote]
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    uses: psyb0t/reusable-github-workflows/.github/workflows/release-workflow.yml@master

  # Requires the ownership label on the pushed image.
  publish-to-mcp-registry:
    needs: [release]
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      id-token: write
      contents: read
    uses: psyb0t/reusable-github-workflows/.github/workflows/mcp-registry-publish.yml@master

  publish-to-clawhub:
    needs: [release]
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: read
    uses: psyb0t/reusable-github-workflows/.github/workflows/clawhub-publish.yml@master
    with:
      skill_names: '["rankrat"]'
      plugin_names: '["rankrat"]'
    secrets:
      clawhub_token: ${{ secrets.CLAWHUB_TOKEN }}

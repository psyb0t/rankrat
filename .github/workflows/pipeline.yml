name: pipeline

on: [push, workflow_dispatch]

jobs:
  # Rankrat publishes images, not a Python package.
  checks:
    permissions:
      contents: read
    uses: psyb0t/reusable-github-workflows/.github/workflows/make-checks.yml@master
    with:
      test_command: "make coverage-percent"
      coverage_file: coverage-percent.txt

  # Wait for the coverage artifact.
  badges:
    needs: [checks]
    if: github.ref_name == github.event.repository.default_branch || startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    uses: psyb0t/reusable-github-workflows/.github/workflows/create-badges.yml@master
    with:
      coverage: true

  call-docker-image-workflow:
    needs: [checks]
    permissions:
      contents: write
      security-events: write
    uses: psyb0t/reusable-github-workflows/.github/workflows/docker-image-workflow.yml@master

    with:
      repository_name: psyb0t/rankrat
      # VEX statements are justified by security regression tests.
      scan_vex_file: security/rankrat-cpython.openvex.json
      scan_only_fixed: true
      scan_severity: "high"
      scan_fail_build: true

    secrets:
      dockerhub_username: ${{ secrets.DOCKERHUB_USERNAME }}
      dockerhub_token: ${{ secrets.DOCKERHUB_TOKEN }}

  call-lighthouse-image-workflow:
    needs: [checks]
    permissions:
      contents: write
      security-events: write
    uses: psyb0t/reusable-github-workflows/.github/workflows/docker-image-workflow.yml@master
    with:
      repository_name: psyb0t/rankrat-lighthouse
      target_platforms: linux/amd64
      build_targets: '[{"file":"Dockerfile.lighthouse","tag_suffix":""}]'
      scan_only_fixed: true
      scan_severity: "high"
      scan_fail_build: true
    secrets:
      dockerhub_username: ${{ secrets.DOCKERHUB_USERNAME }}
      dockerhub_token: ${{ secrets.DOCKERHUB_TOKEN }}

  # Requires the ownership label on the pushed image.
  publish-to-mcp-registry:
    needs: [call-docker-image-workflow]
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      id-token: write
      contents: read
    uses: psyb0t/reusable-github-workflows/.github/workflows/mcp-registry-publish.yml@master

  publish-to-clawhub:
    needs: [call-docker-image-workflow]
    if: startsWith(github.ref, 'refs/tags/')
    uses: psyb0t/reusable-github-workflows/.github/workflows/clawhub-publish.yml@master
    secrets:
      clawhub_token: ${{ secrets.CLAWHUB_TOKEN }}

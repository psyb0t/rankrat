  /v1/monitors:
    get:
      summary: Monitors List
      operationId: monitorsList
      parameters:
      - name: account_id
        in: query
        required: true
        schema:
          type: string
          pattern: ^[a-z0-9][a-z0-9-]{0,62}$
          title: Account Id
      - name: site_url
        in: query
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 2048
          title: Site Url
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 500
          minimum: 1
          default: 100
          title: Limit
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
          title: Offset
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatePage_MonitorDefinition_'
        '422': *id001
        default: *id001
    post:
      summary: Monitor Create
      operationId: monitorCreate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MonitorCreateInput'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MonitorDefinition'
        '422': *id001
        default: *id001
  /v1/monitors/{monitor_id}/snapshots:
    get:
      summary: Monitor Snapshots
      operationId: monitorSnapshotsList
      parameters:
      - name: monitor_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Monitor Id
      - name: account_id
        in: query
        required: true
        schema:
          type: string
          pattern: ^[a-z0-9][a-z0-9-]{0,62}$
          title: Account Id
      - name: site_url
        in: query
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 2048
          title: Site Url
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 500
          minimum: 1
          default: 100
          title: Limit
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
          title: Offset
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatePage_MonitorSnapshot_'
        '422': *id001
        default: *id001
  /v1/monitors/{monitor_id}/issues:
    get:
      summary: Monitor Issues
      operationId: monitorIssuesList
      parameters:
      - name: monitor_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Monitor Id
      - name: account_id
        in: query
        required: true
        schema:
          type: string
          pattern: ^[a-z0-9][a-z0-9-]{0,62}$
          title: Account Id
      - name: site_url
        in: query
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 2048
          title: Site Url
      - name: status
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            pattern: ^(open|acknowledged|resolved)$
          - type: 'null'
          title: Status
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 500
          minimum: 1
          default: 100
          title: Limit
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
          title: Offset
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatePage_TrackedIssue_'
        '422': *id001
        default: *id001
  /v1/issues/{issue_id}/events:
    get:
      summary: Issue Events
      operationId: issueEventsList
      parameters:
      - name: issue_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Issue Id
      - name: monitor_id
        in: query
        required: true
        schema:
          type: string
          format: uuid
          title: Monitor Id
      - name: account_id
        in: query
        required: true
        schema:
          type: string
          pattern: ^[a-z0-9][a-z0-9-]{0,62}$
          title: Account Id
      - name: site_url
        in: query
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 2048
          title: Site Url
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 500
          minimum: 1
          default: 100
          title: Limit
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
          title: Offset
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatePage_IssueEvent_'
        '422': *id001
        default: *id001
  /v1/monitors/{monitor_id}:
    patch:
      summary: Monitor Update
      operationId: monitorUpdate
      parameters:
      - name: monitor_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Monitor Id
      - name: account_id
        in: query
        required: true
        schema:
          type: string
          pattern: ^[a-z0-9][a-z0-9-]{0,62}$
          title: Account Id
      - name: site_url
        in: query
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 2048
          title: Site Url
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/_MonitorUpdateBody'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MonitorDefinition'
        '422': *id001
        default: *id001
    delete:
      summary: Monitor Delete
      operationId: monitorDelete
      parameters:
      - name: monitor_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Monitor Id
      - name: account_id
        in: query
        required: true
        schema:
          type: string
          pattern: ^[a-z0-9][a-z0-9-]{0,62}$
          title: Account Id
      - name: site_url
        in: query
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 2048
          title: Site Url
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MonitorDeleteReceipt'
        '422': *id001
        default: *id001
  /v1/monitors/{monitor_id}/runs:
    post:
      summary: Monitor Run
      operationId: monitorRun
      parameters:
      - name: monitor_id
        in: path
        required: true
        schema:
          type: string
          format: uuid

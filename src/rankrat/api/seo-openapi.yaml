paths:
  /v1/internal-link-graphs:
    post:
      summary: Internal Link Graph
      operationId: internalLinkGraph
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InternalLinkInput'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalLinkGraph'
        '422': &id001
          description: Rankrat error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        default: *id001

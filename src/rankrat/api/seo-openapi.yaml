  /v1/cloudflare/cache-template-applications:
    post:
      summary: Cloudflare Cache Template
      operationId: cloudflareCacheTemplateApply
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CloudflareCacheTemplateInput'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CloudflareCacheRuleReceipt'
        '422': *id001
        default: *id001
components:
  schemas:
    BacklinkAggregateInput:
      properties:
        sources:
          items:
            $ref: '#/components/schemas/BacklinkAggregateSourceInput'
          type: array
          maxItems: 20
          minItems: 1
          title: Sources
        limit_per_source:
          type: integer
          maximum: 1000.0
          minimum: 1.0
          title: Limit Per Source
          default: 100
        timeout_seconds:
          type: number
          maximum: 30.0
          minimum: 0.1
          title: Timeout Seconds
          default: 10.0
      additionalProperties: false
      type: object
      required:
      - sources
      title: BacklinkAggregateInput
    BacklinkAggregateReport:
      properties:
        links:
          items:
            $ref: '#/components/schemas/BacklinkRecord'
          type: array
          title: Links
        referring_domains:
          items:
            type: string
          type: array
          title: Referring Domains
        successful_sources:
          items:
            $ref: '#/components/schemas/Provider'
          type: array
          title: Successful Sources
        failures:
          items:
            $ref: '#/components/schemas/BacklinkSourceFailure'
          type: array
          title: Failures
      type: object
      required:
      - links
      - referring_domains
      - successful_sources
      - failures
      title: BacklinkAggregateReport
    BacklinkAggregateSourceInput:
      properties:
        account_id:
          type: string
          pattern: ^[a-z0-9][a-z0-9-]{0,62}$
          title: Account Id
        provider:
          $ref: '#/components/schemas/Provider'
        target:
          type: string
          maxLength: 2048
          minLength: 1
          title: Target
        site_url:
          anyOf:
          - type: string
            maxLength: 2048
            minLength: 1
          - type: 'null'
          title: Site Url
      additionalProperties: false
      type: object
      required:
      - account_id
      - provider
      - target
      title: BacklinkAggregateSourceInput
    BacklinkReadInput:
      properties:
        account_id:
          type: string
          pattern: ^[a-z0-9][a-z0-9-]{0,62}$
          title: Account Id
        provider:
          $ref: '#/components/schemas/Provider'
        target:
          type: string
          maxLength: 2048
          minLength: 1
          title: Target
        site_url:
          anyOf:
          - type: string
            maxLength: 2048
            minLength: 1
          - type: 'null'
          title: Site Url
        limit:
          type: integer
          maximum: 1000.0
          minimum: 1.0
          title: Limit
          default: 100
        offset:
          type: integer
          maximum: 20000.0
          minimum: 0.0
          title: Offset
          default: 0
        timeout_seconds:
          type: number
          maximum: 30.0
          minimum: 0.1
          title: Timeout Seconds
          default: 10.0
      additionalProperties: false
      type: object
      required:
      - account_id
      - provider
      - target
      title: BacklinkReadInput
    BacklinkRecord:
      properties:
        source_url:
          type: string
          title: Source Url
        target_url:
          type: string
          title: Target Url
        source_domain:
          type: string
          title: Source Domain
        anchor:
          type: string
          title: Anchor
        follow:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Follow
        authority:
          anyOf:
          - type: number
          - type: 'null'
          title: Authority
        first_seen:
          anyOf:
          - type: string
          - type: 'null'
          title: First Seen
        last_seen:
          anyOf:
          - type: string
          - type: 'null'
          title: Last Seen
      type: object
      required:
      - source_url
      - target_url
      - source_domain
      - anchor
      - follow
      - authority
      - first_seen
      - last_seen
      title: BacklinkRecord
    BacklinkResult:
      properties:
        provider:
          $ref: '#/components/schemas/Provider'
        target:
          type: string
          title: Target
        links:
          items:
            $ref: '#/components/schemas/BacklinkRecord'
          type: array
          title: Links
        has_more:
          type: boolean
          title: Has More
      type: object
      required:
      - provider
      - target
      - links
      - has_more
      title: BacklinkResult
    BacklinkSourceFailure:
      properties:
        provider:
          $ref: '#/components/schemas/Provider'
        account_id:
          type: string
          title: Account Id
        code:
          $ref: '#/components/schemas/ProviderFailureCode'
      type: object
      required:
      - provider
      - account_id
      - code
      title: BacklinkSourceFailure
    CloudflareAnalyticsInput:
      properties:
        account_id:
          type: string
          pattern: ^[a-z0-9][a-z0-9-]{0,62}$
          title: Account Id
        zone_id:
          type: string
          pattern: ^[0-9a-f]{32}$
          title: Zone Id
        start:
          type: string
          format: date-time
          title: Start
        end:
          type: string
          format: date-time
          title: End
        limit:
          type: integer
          maximum: 1000.0
          minimum: 1.0
          title: Limit
          default: 100
        timeout_seconds:
          type: number
          maximum: 30.0
          minimum: 0.1
          title: Timeout Seconds
          default: 10.0
      additionalProperties: false
      type: object
      required:
      - account_id
      - zone_id
      - start
      - end
      title: CloudflareAnalyticsInput
    CloudflareAnalyticsPoint:
      properties:
        hour:
          type: string
          title: Hour
        requests:
          type: integer
          title: Requests
        edge_response_bytes:
          type: integer
          title: Edge Response Bytes
        visits:
          type: integer
          title: Visits
        sample_interval:
          type: number
          title: Sample Interval
        cache_status:
          anyOf:
          - type: string
          - type: 'null'
          title: Cache Status
        edge_response_status:
          anyOf:
          - type: integer
          - type: 'null'
          title: Edge Response Status
        trusted_client_category:
          anyOf:
          - type: string
          - type: 'null'
          title: Trusted Client Category
      type: object
      required:
      - hour
      - requests
      - edge_response_bytes
      - visits
      - sample_interval
      - cache_status
      - edge_response_status
      - trusted_client_category
      title: CloudflareAnalyticsPoint
    CloudflareAnalyticsReport:
      properties:
        zone_id:
          type: string
          title: Zone Id
        points:
          items:
            $ref: '#/components/schemas/CloudflareAnalyticsPoint'
          type: array
          title: Points
        sampled:
          type: boolean
          title: Sampled
      type: object
      required:
      - zone_id
      - points
      - sampled
      title: CloudflareAnalyticsReport
    CloudflareCacheRuleReceipt:
      properties:
        zone_id:
          type: string
          title: Zone Id
        template:
          $ref: '#/components/schemas/CloudflareCacheTemplate'
        changed:
          type: boolean
          title: Changed
        ruleset_id:
          type: string
          title: Ruleset Id
        rule_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Rule Id
        previous_managed_rule:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Previous Managed Rule
      type: object
      required:
      - zone_id
      - template
      - changed
      - ruleset_id
      - rule_id
      - previous_managed_rule
      title: CloudflareCacheRuleReceipt
    CloudflareCacheTemplate:
      type: string
      enum:
      - cache_static_assets
      - bypass_html
      title: CloudflareCacheTemplate
    CloudflareCacheTemplateInput:
      properties:
        account_id:
          type: string
          pattern: ^[a-z0-9][a-z0-9-]{0,62}$
          title: Account Id
        zone_id:
          type: string
          pattern: ^[0-9a-f]{32}$
          title: Zone Id
        template:
          $ref: '#/components/schemas/CloudflareCacheTemplate'
        timeout_seconds:
          type: number
          maximum: 30.0
          minimum: 0.1
          title: Timeout Seconds
          default: 10.0
      additionalProperties: false
      type: object
      required:
      - account_id
      - zone_id
      - template
      title: CloudflareCacheTemplateInput
    CloudflarePurgeInput:
      properties:
        account_id:
          type: string
          pattern: ^[a-z0-9][a-z0-9-]{0,62}$
          title: Account Id
        zone_id:
          type: string
          pattern: ^[0-9a-f]{32}$
          title: Zone Id
        site_url:
          type: string
          maxLength: 2048
          minLength: 1
          title: Site Url
        urls:
          items:
            type: string
            maxLength: 2048
            minLength: 1
          type: array
          maxItems: 30
          minItems: 1
          title: Urls
        timeout_seconds:
          type: number
          maximum: 30.0
          minimum: 0.1
          title: Timeout Seconds
          default: 10.0
      additionalProperties: false
      type: object
      required:
      - account_id
      - zone_id
      - site_url
      - urls
      title: CloudflarePurgeInput
    CloudflarePurgeReceipt:
      properties:
        zone_id:
          type: string
          title: Zone Id
        purged_urls:
          items:
            type: string
          type: array
          title: Purged Urls
        provider_request_id:
          type: string
          title: Provider Request Id
      type: object
      required:
      - zone_id
      - purged_urls
      - provider_request_id
      title: CloudflarePurgeReceipt
    ContentOpportunity:
      properties:
        query:
          anyOf:
          - type: string
          - type: 'null'
          title: Query
        page_url:
          anyOf:
          - type: string
          - type: 'null'
          title: Page Url
        score:
          type: number
          title: Score
        confidence:
          $ref: '#/components/schemas/OpportunityConfidence'
        reasons:
          items:
            type: string
          type: array
          title: Reasons
        evidence_sources:
          items:
            type: string
          type: array
          title: Evidence Sources
        clicks:
          type: number
          title: Clicks
        impressions:
          type: number
          title: Impressions
        ctr:
          type: number
          title: Ctr
        average_position:
          anyOf:
          - type: number
          - type: 'null'
          title: Average Position
        sessions:
          anyOf:
          - type: number
          - type: 'null'
          title: Sessions
      type: object
      required:
      - query
      - page_url
      - score
      - confidence
      - reasons
      - evidence_sources
      - clicks
      - impressions
      - ctr
      - average_position
      - sessions
      title: ContentOpportunity
    ContentOpportunityInput:
      properties:
        google_account_id:
          type: string
          pattern: ^[a-z0-9][a-z0-9-]{0,62}$
          title: Google Account Id
        search_console_site_url:
          type: string
          maxLength: 2048
          minLength: 1
          title: Search Console Site Url
        bing_account_id:
          type: string
          pattern: ^[a-z0-9][a-z0-9-]{0,62}$
          title: Bing Account Id
        bing_site_url:
          type: string
          maxLength: 2048
          minLength: 1
          title: Bing Site Url
        ga4_account_id:
          type: string
          pattern: ^[a-z0-9][a-z0-9-]{0,62}$
          title: Ga4 Account Id
        ga4_property_id:
          type: string
          pattern: ^[0-9]+$
          title: Ga4 Property Id

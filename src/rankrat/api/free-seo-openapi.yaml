components:
  schemas:
    BingContentSubmissionInput:
      properties:
        account_id:
          type: string
          pattern: ^[a-z0-9][a-z0-9-]{0,62}$
          title: Account Id
        site_url:
          type: string
          maxLength: 2048
          minLength: 1
          title: Site Url
        page_url:
          type: string
          maxLength: 2048
          minLength: 1
          title: Page Url
        dynamic_serving:
          type: boolean
          title: Dynamic Serving
          default: false
        timeout_seconds:
          type: number
          maximum: 30.0
          minimum: 0.1
          title: Timeout Seconds
          default: 10.0
      additionalProperties: false
      type: object
      required:
      - account_id
      - site_url
      - page_url
      title: BingContentSubmissionInput
    BingContentSubmissionReceipt:
      properties:
        site_url:
          type: string
          title: Site Url
        page_url:
          type: string
          title: Page Url
        content_bytes:
          type: integer
          title: Content Bytes
        dynamic_serving:
          type: boolean
          title: Dynamic Serving
      type: object
      required:
      - site_url
      - page_url
      - content_bytes
      - dynamic_serving
      title: BingContentSubmissionReceipt
    ClarityDimension:
      type: string
      enum:
      - Browser
      - Device
      - Country/Region
      - OS
      - Source
      - Medium
      - Campaign
      - Channel
      - URL
      title: ClarityDimension
      description: Documented Microsoft Clarity live-insights breakdown dimensions.
    ClarityInsightsInput:
      properties:
        account_id:
          type: string
          pattern: ^[a-z0-9][a-z0-9-]{0,62}$
          title: Account Id
        num_days:
          type: integer
          maximum: 3.0
          minimum: 1.0
          title: Num Days
          default: 1
        dimensions:
          items:
            $ref: '#/components/schemas/ClarityDimension'
          type: array
          maxItems: 3
          title: Dimensions
          default: []
        timeout_seconds:
          type: number
          maximum: 30.0
          minimum: 0.1
          title: Timeout Seconds
          default: 10.0
      additionalProperties: false
      type: object
      required:
      - account_id
      title: ClarityInsightsInput
    ClarityInsightsReport:
      properties:
        num_days:
          type: integer
          title: Num Days
        dimensions:
          items:
            $ref: '#/components/schemas/ClarityDimension'
          type: array
          title: Dimensions
        metrics:
          items:
            $ref: '#/components/schemas/ClarityMetric'
          type: array
          title: Metrics
      type: object
      required:
      - num_days
      - dimensions
      - metrics
      title: ClarityInsightsReport
    ClarityMetric:
      properties:
        metric_name:
          type: string
          title: Metric Name
        information:
          items:
            additionalProperties:
              $ref: '#/components/schemas/ClarityScalar'
            type: object
          type: array
          title: Information
      type: object
      required:
      - metric_name
      - information
      title: ClarityMetric
    ClarityScalar:
      anyOf:
      - type: string
      - type: integer
      - type: number
      - type: boolean
      - type: 'null'
    CloudflareEdgeRedirect:
      properties:
        zone_id:
          type: string
          title: Zone Id
        rule_id:
          type: string
          title: Rule Id
        source_path:
          type: string
          title: Source Path
        target_url:
          type: string
          title: Target Url
        status_code:
          $ref: '#/components/schemas/CloudflareRedirectStatus'
        preserve_query_string:
          type: boolean
          title: Preserve Query String
      type: object
      required:
      - zone_id
      - rule_id
      - source_path
      - target_url
      - status_code
      - preserve_query_string
      title: CloudflareEdgeRedirect
    CloudflareEdgeRedirectReceipt:
      properties:
        redirect:
          $ref: '#/components/schemas/CloudflareEdgeRedirect'
        created:
          type: boolean
          title: Created
        changed:
          type: boolean
          title: Changed
      type: object
      required:
      - redirect
      - created
      - changed
      title: CloudflareEdgeRedirectReceipt
    CloudflareRedirectStatus:
      type: integer
      enum:
      - 301
      - 302
      - 307
      - 308
      title: CloudflareRedirectStatus
      description: Documented Cloudflare redirect status codes Rankrat can create.
    EdgeRedirectDeleteInput:
      properties:
        account_id:
          type: string
          pattern: ^[a-z0-9][a-z0-9-]{0,62}$
          title: Account Id
        site_url:
          type: string
          maxLength: 2048
          minLength: 1
          title: Site Url
        timeout_seconds:
          type: number
          maximum: 30.0
          minimum: 0.1
          title: Timeout Seconds
          default: 10.0
        rule_id:
          type: string
          pattern: ^[0-9a-f]{32}$
          title: Rule Id
      additionalProperties: false
      type: object
      required:
      - account_id
      - site_url
      - rule_id
      title: EdgeRedirectDeleteInput
    EdgeRedirectUpsertInput:
      properties:
        account_id:
          type: string
          pattern: ^[a-z0-9][a-z0-9-]{0,62}$
          title: Account Id
        site_url:
          type: string
          maxLength: 2048
          minLength: 1
          title: Site Url
        timeout_seconds:
          type: number
          maximum: 30.0
          minimum: 0.1
          title: Timeout Seconds
          default: 10.0
        source_path:
          type: string
          maxLength: 2048
          minLength: 1
          title: Source Path
        target_url:
          type: string
          maxLength: 2048
          minLength: 1
          title: Target Url
        status_code:
          $ref: '#/components/schemas/CloudflareRedirectStatus'
          default: 301
        preserve_query_string:
          type: boolean
          title: Preserve Query String
          default: true
      additionalProperties: false
      type: object
      required:
      - account_id
      - site_url
      - source_path
      - target_url
      title: EdgeRedirectUpsertInput
    GtmAccount:
      properties:
        account_id:
          type: string
          title: Account Id
        name:
          type: string
          title: Name
        path:
          type: string
          title: Path
      type: object
      required:
      - account_id
      - name
      - path
      title: GtmAccount
    GtmContainer:
      properties:
        account_id:
          type: string
          title: Account Id
        container_id:
          type: string
          title: Container Id
        name:
          type: string
          title: Name
        path:
          type: string
          title: Path
        public_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Public Id
      type: object
      required:
      - account_id
      - container_id
      - name
      - path
      - public_id
      title: GtmContainer
    GtmContainerCreateInput:
      properties:
        account_id:
          type: string
          pattern: ^[a-z0-9][a-z0-9-]{0,62}$
          title: Account Id
        timeout_seconds:
          type: number
          maximum: 30.0
          minimum: 0.1
          title: Timeout Seconds
          default: 10.0
        gtm_account_id:
          type: string
          pattern: ^[0-9]{1,64}$
          title: Gtm Account Id
        name:
          type: string
          maxLength: 512
          minLength: 1
          title: Name
        usage_contexts:
          items:
            $ref: '#/components/schemas/GtmUsageContext'
          type: array
          maxItems: 5
          minItems: 1
          title: Usage Contexts
      additionalProperties: false
      type: object
      required:
      - account_id
      - gtm_account_id
      - name
      - usage_contexts
      title: GtmContainerCreateInput
    GtmContainerDeleteInput:
      properties:
        account_id:
          type: string
          pattern: ^[a-z0-9][a-z0-9-]{0,62}$
          title: Account Id
        timeout_seconds:
          type: number
          maximum: 30.0
          minimum: 0.1
          title: Timeout Seconds
          default: 10.0
        gtm_account_id:
          type: string
          pattern: ^[0-9]{1,64}$
          title: Gtm Account Id
        container_id:
          type: string
          pattern: ^[0-9]{1,64}$
          title: Container Id
      additionalProperties: false
      type: object
      required:
      - account_id
      - gtm_account_id
      - container_id
      title: GtmContainerDeleteInput
    GtmEntity:
      properties:
        kind:
          $ref: '#/components/schemas/GtmEntityKind'
        account_id:
          type: string
          title: Account Id
        container_id:
          type: string
          title: Container Id

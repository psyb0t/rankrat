components:
  securitySchemes:
    BearerAuth:
      bearerFormat: opaque
      description: Required for protected HTTP endpoints.
      scheme: bearer
      type: http
  schemas:
    _BingBacklinkIntelligenceBody:
      additionalProperties: false
      properties:
        account_id:
          pattern: ^[a-z0-9][a-z0-9-]{0,62}$
          title: Account Id
          type: string
        max_pages_per_target:
          default: 1
          maximum: 1001.0
          minimum: 1.0
          title: Max Pages Per Target
          type: integer
        site_url:
          maxLength: 2048
          minLength: 1
          title: Site Url
          type: string
        target_urls:
          items:
            type: string
          maxItems: 20
          minItems: 1
          title: Target Urls
          type: array
        timeout_seconds:
          default: 10.0
          maximum: 30.0
          minimum: 0.1
          title: Timeout Seconds
          type: number
      required:
      - account_id
      - site_url
      - target_urls
      title: _BingBacklinkIntelligenceBody
      type: object
    _SiteAuditBody:
      additionalProperties: false
      properties:
        account_id:
          pattern: ^[a-z0-9][a-z0-9-]{0,62}$
          title: Account Id
          type: string
        max_depth:
          default: 2
          maximum: 4.0
          minimum: 0.0
          title: Max Depth
          type: integer
        max_pages:
          default: 50
          maximum: 200.0
          minimum: 1.0
          title: Max Pages
          type: integer
        site_url:
          maxLength: 2048
          minLength: 1
          title: Site Url
          type: string
        timeout_seconds:
          default: 10.0
          maximum: 30.0
          minimum: 0.1
          title: Timeout Seconds
          type: number
      required:
      - account_id
      - site_url
      title: _SiteAuditBody
      type: object
    _SiteOwnershipBody:
      additionalProperties: false
      properties:
        bing_account_id:
          pattern: ^[a-z0-9][a-z0-9-]{0,62}$
          title: Bing Account Id
          type: string
        cloudflare_account_id:
          pattern: ^[a-z0-9][a-z0-9-]{0,62}$
          title: Cloudflare Account Id
          type: string
        google_account_id:
          pattern: ^[a-z0-9][a-z0-9-]{0,62}$
          title: Google Account Id
          type: string
        site_url:
          maxLength: 2048
          minLength: 1
          title: Site Url
          type: string
        timeout_seconds:
          default: 10.0
          maximum: 30.0
          minimum: 0.1
          title: Timeout Seconds
          type: number
      required:
      - google_account_id
      - bing_account_id
      - cloudflare_account_id
      - site_url
      title: _SiteOwnershipBody
      type: object
    _SiteRemediationBody:
      additionalProperties: false
      properties:
        bing_account_id:
          pattern: ^[a-z0-9][a-z0-9-]{0,62}$
          title: Bing Account Id
          type: string
        bing_site_url:
          maxLength: 2048
          minLength: 1
